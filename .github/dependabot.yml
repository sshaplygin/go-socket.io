version: 2
updates:
  - package-ecosystem: gomod
    # The v1 module at the repository root and the v2 module in v2/.
    directories: ["/", "/v2"]
    schedule:
      interval: weekly
    ignore:
      # gobwas/ws v1.5.0 declares go 1.26; v2 (its only user here) supports Go 1.22.
      - dependency-name: github.com/gobwas/ws
        versions: [">= 1.5.0"]
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: gomod
    # Standalone example and experiment modules, each with its own go.mod; add
    # /v2/adapters/* and /v2/contrib/* here when those modules exist.
    directories: ["/_examples/*", "/v2/_examples/*", "/v2/_experiments/*"]
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
