version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: gomod
    # Standalone _experiments modules; the glob matches nothing until one is merged.
    directories: ["/_experiments/*"]
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: "/"
    target-branch: v1.x
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: v1.x
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
