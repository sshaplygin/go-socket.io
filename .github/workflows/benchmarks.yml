name: Benchmarks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect benchmark-relevant changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      bench_v1: ${{ steps.packages.outputs.bench_v1 }}
      bench_v2: ${{ steps.packages.outputs.bench_v2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            v2/go.sum
      - name: Test change classification
        run: go test ./.github/changes
      # The classifier of .github/changes (as in ci.yaml) decides whether this update changed
      # anything a benchmark measures: the update since the previous head, or since the
      # merge base when the PR opens or the previous head is unavailable.
      - name: Detect benchmark-relevant changes of this update
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          change_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          if [[ -n "$BEFORE_SHA" ]]; then
            if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null || git fetch origin "$BEFORE_SHA"; then
              change_base=$BEFORE_SHA
            fi
          fi
          go run ./.github/changes "$change_base" "$HEAD_SHA" > update.txt
          cat update.txt
          grep '^changed=' update.txt >> "$GITHUB_OUTPUT"
      # The comparison covers the whole PR, so the packages come from the merge base.
      - name: Select the benchmark packages of the pull request
        id: packages
        if: steps.changes.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          go run ./.github/changes "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA" > pr.txt
          cat pr.txt
          grep -E '^bench_v[12]=' pr.txt >> "$GITHUB_OUTPUT"
      - name: Explain skipped benchmarks
        if: steps.changes.outputs.changed == 'false'
        run: echo 'Benchmarks skipped because this update changes no package that a benchmark measures.' >> "$GITHUB_STEP_SUMMARY"

  compare:
    name: Go benchmarks, base vs PR
    needs: changes
    if: needs.changes.outputs.changed == 'true' && (needs.changes.outputs.bench_v1 != '' || needs.changes.outputs.bench_v2 != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      gate: ${{ steps.generate.outputs.gate }}
    env:
      GOTOOLCHAIN: local
      BENCH_V1: ${{ needs.changes.outputs.bench_v1 }}
      BENCH_V2: ${{ needs.changes.outputs.bench_v2 }}
    steps:
      - name: Check out base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Check out PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            base/go.sum
            base/v2/go.sum
            pr/go.sum
            pr/v2/go.sum
      # Two modules: the v1 module at the root and the v2 module in v2/. Both append to the
      # same file per side. Each side benchmarks the packages the classifier selected (a
      # pattern list, or ./... for every package). Each side drops packages without
      # benchmarks. If either side has none of the selected benchmarks, both run every
      # package so additions and removals still produce a complete comparison. A
      # base from before the restructure has no v2/go.mod (its v2 code is at the root), so its
      # v2 selection is empty.
      - name: Select the packages of each side
        id: select
        run: |
          set -euo pipefail
          with_benchmarks() {
            local root=$1 out=() p
            shift
            for p in "$@"; do
              if [[ $p == ./... ]] || grep -qs '^func Benchmark' "$root/$p"/*_test.go; then
                out+=("$p")
              fi
            done
            echo "${out[*]:-}"
          }
          base_v1=$(with_benchmarks base $BENCH_V1)
          base_v2=
          if [[ -f base/v2/go.mod ]]; then base_v2=$(with_benchmarks base/v2 $BENCH_V2); fi
          head_v1=$(with_benchmarks pr $BENCH_V1)
          head_v2=
          if [[ -f pr/v2/go.mod ]]; then head_v2=$(with_benchmarks pr/v2 $BENCH_V2); fi
          if [[ -z "$base_v1$base_v2" || -z "$head_v1$head_v2" ]]; then
            echo 'One side has no selected benchmarks: every package runs on both sides.'
            base_v1=./...
            head_v1=./...
            if [[ -f pr/v2/go.mod ]]; then head_v2=./...; fi
            if [[ -f base/v2/go.mod ]]; then base_v2=./...; fi
          fi
          printf '%s\n' "base_v1=$base_v1" "base_v2=$base_v2" "head_v1=$head_v1" "head_v2=$head_v2" | tee -a "$GITHUB_OUTPUT"
      - name: Benchmark base, v1 module
        if: steps.select.outputs.base_v1 != ''
        working-directory: base
        env:
          PKGS: ${{ steps.select.outputs.base_v1 }}
        run: go test -mod=readonly -run '^$' -bench . -benchmem -count=10 $PKGS | tee -a ../base.txt
      - name: Benchmark base, v2 module
        if: steps.select.outputs.base_v2 != ''
        working-directory: base/v2
        env:
          PKGS: ${{ steps.select.outputs.base_v2 }}
        run: go test -mod=readonly -run '^$' -bench . -benchmem -count=10 $PKGS | tee -a ../../base.txt
      - name: Benchmark PR, v1 module
        if: steps.select.outputs.head_v1 != ''
        working-directory: pr
        env:
          PKGS: ${{ steps.select.outputs.head_v1 }}
        run: go test -mod=readonly -run '^$' -bench . -benchmem -count=10 $PKGS | tee -a ../pr.txt
      - name: Benchmark PR, v2 module
        if: steps.select.outputs.head_v2 != ''
        working-directory: pr/v2
        env:
          PKGS: ${{ steps.select.outputs.head_v2 }}
        run: go test -mod=readonly -run '^$' -bench . -benchmem -count=10 $PKGS | tee -a ../../pr.txt
      - name: Record completed inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_V1: ${{ steps.select.outputs.base_v1 }}
          BASE_V2: ${{ steps.select.outputs.base_v2 }}
          HEAD_V1: ${{ steps.select.outputs.head_v1 }}
          HEAD_V2: ${{ steps.select.outputs.head_v2 }}
        run: |
          grep -Eq '^Benchmark[^[:space:]]*[[:space:]]+[0-9]+[[:space:]]' base.txt
          grep -Eq '^Benchmark[^[:space:]]*[[:space:]]+[0-9]+[[:space:]]' pr.txt
          toolchain=$(go env GOVERSION)
          goos=$(go env GOOS)
          goarch=$(go env GOARCH)
          for side in base head; do
            revision=$BASE_SHA
            file=base.txt
            packages="v1: ${BASE_V1:-none}; v2: ${BASE_V2:-none}"
            if [[ "$side" == head ]]; then
              revision=$HEAD_SHA
              file=pr.txt
              packages="v1: ${HEAD_V1:-none}; v2: ${HEAD_V2:-none}"
            fi
            command="go test -mod=readonly -run '^$' -bench . -benchmem -count=10 <packages> ($packages)"
            jq -n --arg revision "$revision" --arg file "$file" \
              --arg toolchain "$toolchain" --arg os "$goos" --arg arch "$goarch" --arg command "$command" \
              '{schema_version:1,revision:$revision,
                environment:{toolchain:$toolchain,os:$os,arch:$arch,runner:"github-hosted:ubuntu-24.04"},
                expected_suites:["go"],suites:[{id:"go",parser:{name:"go",version:"1"},command:$command,files:[$file]}]}' \
              > "$side-manifest.json"
          done
      - name: Generate report and offline replay bundle
        id: generate
        uses: sshaplygin/benchmark-report/report@f71129f2bebcf57f953b27607b7d8bb8c23afae9 # v0.1.0
        with:
          parser: go
          base-manifest: base-manifest.json
          head-manifest: head-manifest.json
          config: pr/.github/benchmarks/benchmark-report.json
          comment-header: go-socket.io-benchmarks
      - name: Upload complete report bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-benchmarks
          path: ${{ steps.generate.outputs.artifact-path }}
          if-no-files-found: error
          retention-days: 14
      - name: Preserve raw logs on benchmark or generation failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-benchmark-failed-logs
          path: |
            base.txt
            pr.txt
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Publish benchmark comparison
    needs: compare
    if: ${{ !cancelled() && needs.compare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      # This job executes no PR checkout, benchmark code, or artifact executable.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: go-benchmarks
          path: bundle
      - name: Summarize complete results for every PR
        uses: sshaplygin/benchmark-report@f71129f2bebcf57f953b27607b7d8bb8c23afae9 # v0.1.0
        with:
          report-path: bundle/report.md
          header: go-socket.io-benchmarks
          publish: 'false'
      - name: Publish bounded comment when eligible
        uses: sshaplygin/benchmark-report@f71129f2bebcf57f953b27607b7d8bb8c23afae9 # v0.1.0
        with:
          report-path: bundle/comment.md
          header: go-socket.io-benchmarks
          summary: 'false'
      - name: Apply regression gate after upload and publication
        if: needs.compare.outputs.gate == 'failed'
        run: exit 1
