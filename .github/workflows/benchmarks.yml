name: Benchmarks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect benchmark-relevant changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Test change detection
        run: go test ./.github/benchmarks
      - name: Test report rendering
        run: go test ./.github/benchmarks/report
      - name: Detect code changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          change_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          if [[ -n "$BEFORE_SHA" ]]; then
            if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null || git fetch origin "$BEFORE_SHA"; then
              change_base=$BEFORE_SHA
            fi
          fi
          go run ./.github/benchmarks "$change_base" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"
      - name: Explain skipped benchmarks
        if: steps.changes.outputs.changed == 'false'
        run: echo 'Benchmarks skipped because this update contains no benchmark-relevant code changes.' >> "$GITHUB_STEP_SUMMARY"

  compare:
    name: Go benchmarks, base vs PR
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      gate: ${{ steps.generate.outputs.gate }}
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Check out PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            base/go.sum
            base/v2/go.sum
            pr/go.sum
            pr/v2/go.sum
      # Two modules: the v1 module at the root and the v2 module in v2/. Both append to the
      # same file per side. A base from before the restructure has no v2/go.mod (its v2 code
      # is at the root), so its v2 step is skipped.
      - name: Benchmark base, v1 module
        working-directory: base
        run: go test -mod=readonly -run '^$' -bench . -benchmem -count=10 ./... | tee -a ../base.txt
      - name: Benchmark base, v2 module
        if: hashFiles('base/v2/go.mod') != ''
        working-directory: base/v2
        run: go test -mod=readonly -run '^$' -bench . -benchmem -count=10 ./... | tee -a ../../base.txt
      - name: Benchmark PR, v1 module
        working-directory: pr
        run: go test -mod=readonly -run '^$' -bench . -benchmem -count=10 ./... | tee -a ../pr.txt
      - name: Benchmark PR, v2 module
        working-directory: pr/v2
        run: go test -mod=readonly -run '^$' -bench . -benchmem -count=10 ./... | tee -a ../../pr.txt
      - name: Record completed inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          grep -Eq '^Benchmark[^[:space:]]*[[:space:]]+[0-9]+[[:space:]]' base.txt
          grep -Eq '^Benchmark[^[:space:]]*[[:space:]]+[0-9]+[[:space:]]' pr.txt
          toolchain=$(go env GOVERSION)
          goos=$(go env GOOS)
          goarch=$(go env GOARCH)
          command="go test -mod=readonly -run '^$' -bench . -benchmem -count=10 ./... (in . and in v2)"
          for side in base head; do
            revision=$BASE_SHA
            file=base.txt
            if [[ "$side" == head ]]; then revision=$HEAD_SHA; file=pr.txt; fi
            jq -n --arg revision "$revision" --arg file "$file" \
              --arg toolchain "$toolchain" --arg os "$goos" --arg arch "$goarch" --arg command "$command" \
              '{schema_version:1,revision:$revision,
                environment:{toolchain:$toolchain,os:$os,arch:$arch,runner:"github-hosted:ubuntu-24.04"},
                expected_suites:["go"],suites:[{id:"go",parser:{name:"go",version:"1"},command:$command,files:[$file]}]}' \
              > "$side-manifest.json"
          done
      - name: Generate report and offline replay bundle
        id: generate
        uses: sshaplygin/benchmark-report/report@f71129f2bebcf57f953b27607b7d8bb8c23afae9 # v0.1.0
        with:
          parser: go
          base-manifest: base-manifest.json
          head-manifest: head-manifest.json
          config: pr/.github/benchmarks/benchmark-report.json
          comment-header: go-socket.io-benchmarks
      - name: Upload complete report bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-benchmarks
          path: ${{ steps.generate.outputs.artifact-path }}
          if-no-files-found: error
          retention-days: 14
      - name: Preserve raw logs on benchmark or generation failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-benchmark-failed-logs
          path: |
            base.txt
            pr.txt
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Publish benchmark comparison
    needs: compare
    if: ${{ !cancelled() && needs.compare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      # This job executes no PR checkout, benchmark code, or artifact executable.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: go-benchmarks
          path: bundle
      - name: Summarize complete results for every PR
        uses: sshaplygin/benchmark-report@f71129f2bebcf57f953b27607b7d8bb8c23afae9 # v0.1.0
        with:
          report-path: bundle/report.md
          header: go-socket.io-benchmarks
          publish: 'false'
      - name: Publish bounded comment when eligible
        uses: sshaplygin/benchmark-report@f71129f2bebcf57f953b27607b7d8bb8c23afae9 # v0.1.0
        with:
          report-path: bundle/comment.md
          header: go-socket.io-benchmarks
          summary: 'false'
      - name: Apply regression gate after upload and publication
        if: needs.compare.outputs.gate == 'failed'
        run: exit 1
