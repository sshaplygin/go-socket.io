name: CI
permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 8 * * 1' # Mondays 08:00 UTC

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Go Tidy
        run: go mod tidy && git diff --exit-code
      - name: Go Mod Verify
        run: go mod verify
      - name: Format
        run: gofmt -s -l . && test -z "$(gofmt -s -l .)"
      - name: Vet
        run: go vet ./...
      - name: Package graph
        run: make graph
      - name: Frozen contract
        run: make freeze
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: govulncheck
        # setup-go reads a manifest that can lag behind go.dev, so scan with the newest
        # published release; the go command downloads that toolchain via the module proxy.
        run: |
          set -eu
          version="$(curl -fsS 'https://go.dev/VERSION?m=text' | head -n 1)"
          if ! printf '%s\n' "$version" | grep -Eq '^go1\.[0-9]+(\.[0-9]+)?$'; then
            echo "unexpected Go version from go.dev: '$version'" >&2
            exit 1
          fi
          export GOTOOLCHAIN="$version"
          go version
          go install golang.org/x/vuln/cmd/govulncheck@latest
          make vuln

  test:
    name: Test ${{ matrix.os }} Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['stable', 'oldstable']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Go version
        run: go version
      - name: Tests with race detector
        run: go test -race -count=1 ./...

  min-go:
    name: Test ubuntu-latest Go 1.22 (GOTOOLCHAIN=local)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Never download a newer toolchain: fail if go.mod or a dependency
      # requires a Go version newer than the installed 1.22.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
      - name: Go version
        run: |
          go version
          go version | grep -q ' go1\.22\.'
      - name: Build
        run: go build ./...
      - name: Tests with race detector
        run: go test -race -count=1 ./...

  examples:
    name: Build examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      # Stage 2.0 removed the v1 root runtime the application examples build against,
      # so only the identical-copy check of chat.go runs until 2.5D migrates them.
      - name: Check the shared example sources
        run: make examples

  experiments:
    name: Experiments
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Install golangci-lint
        # The lint action runs one working directory; make experiments lints each module.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Vet, format, lint and test every experiment module
        run: make experiments
