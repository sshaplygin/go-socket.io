name: CI
permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 8 * * 1' # Mondays 08:00 UTC

# Two independent modules: v1 at the repository root (github.com/sshaplygin/go-socket.io)
# and v2 in v2/ (github.com/sshaplygin/go-socket.io/v2). The changes job runs the
# classifier of .github/changes: on a pull request every other job runs only when the
# diff reaches something it checks, and the test jobs test only the affected packages;
# push and schedule run everything. Jobs are skipped with a job-level if, never with
# workflow-level paths filters, so that the required checks always report.
jobs:
  changes:
    name: Changed packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      v1: ${{ steps.classify.outputs.v1 }}
      v1_packages: ${{ steps.classify.outputs.v1_packages }}
      gates_v1: ${{ steps.classify.outputs.gates_v1 }}
      examples_v1: ${{ steps.classify.outputs.examples_v1 }}
      conformance: ${{ steps.classify.outputs.conformance }}
      v2: ${{ steps.classify.outputs.v2 }}
      v2_packages: ${{ steps.classify.outputs.v2_packages }}
      gates_v2: ${{ steps.classify.outputs.gates_v2 }}
      examples_v2: ${{ steps.classify.outputs.examples_v2 }}
      experiments_v2: ${{ steps.classify.outputs.experiments_v2 }}
      sync: ${{ steps.classify.outputs.sync }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            go.sum
            v2/go.sum
      - name: Test the classifier
        run: go test -count=1 ./.github/changes
      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          args=(-full)
          if [[ "$EVENT" == pull_request ]]; then
            args=("$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA")
          fi
          if ! go run ./.github/changes "${args[@]}" >outputs.txt 2>reasons.txt; then
            cat reasons.txt >&2
            exit 1
          fi
          cat reasons.txt outputs.txt
          cat outputs.txt >> "$GITHUB_OUTPUT"
          {
            echo '### Change classification'
            echo '```'
            cat reasons.txt outputs.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # A change in _examples/ or _experiments/ starts no lint job, so the format of every
      # changed Go file is checked here.
      - name: Format of the changed Go files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=AMT -z "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA" -- '*.go' \
            | xargs -0 -r gofmt -s -l > unformatted.txt
          cat unformatted.txt
          test ! -s unformatted.txt

  conformance:
    name: Conformance ${{ matrix.client }}
    needs: changes
    # A required check. A skipped matrix job reports one check under the unexpanded name,
    # which never satisfies the required names, so this job always runs and skips its
    # steps instead.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        client: ['socket.io-client@1.7.4', 'socket.io-client@2.5.0']
    env:
      CONFORMANCE_NODE_MODULES: ${{ github.workspace }}/internal/conformance/testdata/node/node_modules
      RUN: ${{ needs.changes.outputs.conformance }}
    steps:
      - name: Skip without a change that reaches the conformance tests or the examples
        if: env.RUN != 'true'
        run: echo 'Conformance skipped; see the Changed packages job for the classification.'
      - uses: actions/checkout@v4
        if: env.RUN == 'true'
      - uses: actions/setup-go@v5
        if: env.RUN == 'true'
        with:
          go-version: stable
          check-latest: true
      - uses: actions/setup-node@v4
        if: env.RUN == 'true'
        with:
          node-version: 'lts/*'
      - name: Install the pinned reference client and server in separate prefixes
        if: env.RUN == 'true'
        env:
          CLIENT: ${{ matrix.client }}
        run: |
          npm install --no-save --prefix internal/conformance/testdata/node "$CLIENT"
          npm install --no-save --prefix internal/conformance/testdata/node/server socket.io@2.5.0
          echo "CONFORMANCE_CLIENT_VERSION=${CLIENT#*@}" >> "$GITHUB_ENV"
      - name: Run tagged interoperability and raw transport tests
        if: env.RUN == 'true'
        run: make conformance
      - name: Run executable examples with the pinned client
        if: env.RUN == 'true'
        run: make examples-node

  sync-check:
    name: Check shared-file drift
    needs: changes
    # A required check; a skipped job reports success.
    if: needs.changes.outputs.sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare shared sources across modules
        run: make sync-check

  gates-v1:
    name: Gates v1 (parity, architecture)
    needs: changes
    if: needs.changes.outputs.gates_v1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Parity, termination and role gates; component graph and negative fixtures
        run: make gates

  gates-v2:
    name: Gates v2 (graph, frozen contract, inventory)
    needs: changes
    if: needs.changes.outputs.gates_v2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: v2/go.sum
      - name: Package graph, frozen contract, compile fixtures and API inventory
        run: make g2

  lint-v1:
    name: Lint v1
    needs: changes
    if: needs.changes.outputs.v1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Go Tidy
        run: go mod tidy && git diff --exit-code
      - name: Go Mod Verify
        run: go mod verify
      - name: Format
        run: gofmt -s -l . && test -z "$(gofmt -s -l .)"
      - name: Vet
        run: go vet ./... ./.github/architecture ./.github/changes
      # These two steps run tests. A pull request that changes only Go comments or
      # formatting runs lint-v1 without packages to test (v1_packages is empty) and skips
      # them; Covers markers start gates-v1 instead.
      - name: Component graph and negative fixtures
        if: needs.changes.outputs.v1_packages != ''
        run: make architecture-check
      - name: Parity markers and API coverage ratchets
        if: needs.changes.outputs.v1_packages != ''
        run: make parity-check cover-check
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: ./... ./.github/architecture ./.github/changes
      - name: govulncheck
        # setup-go reads a manifest that can lag behind go.dev, so scan with the newest
        # published release; the go command downloads that toolchain via the module proxy.
        run: |
          set -eu
          version="$(curl -fsS 'https://go.dev/VERSION?m=text' | head -n 1)"
          if ! printf '%s\n' "$version" | grep -Eq '^go1\.[0-9]+(\.[0-9]+)?$'; then
            echo "unexpected Go version from go.dev: '$version'" >&2
            exit 1
          fi
          export GOTOOLCHAIN="$version"
          go version
          go install golang.org/x/vuln/cmd/govulncheck@latest
          make vuln

  lint-v2:
    name: Lint v2
    needs: changes
    if: needs.changes.outputs.v2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: v2/go.sum
      - name: Go Tidy
        run: go mod tidy && git diff --exit-code
      - name: Go Mod Verify
        run: go mod verify
      - name: Format
        run: gofmt -s -l . && test -z "$(gofmt -s -l .)"
      - name: Vet
        run: go vet ./...
      - name: Package graph
        run: make graph
      - name: Frozen contract
        run: make freeze
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: v2
      - name: govulncheck
        # As in lint-v1: scan with the newest Go release from go.dev.
        run: |
          set -eu
          version="$(curl -fsS 'https://go.dev/VERSION?m=text' | head -n 1)"
          if ! printf '%s\n' "$version" | grep -Eq '^go1\.[0-9]+(\.[0-9]+)?$'; then
            echo "unexpected Go version from go.dev: '$version'" >&2
            exit 1
          fi
          export GOTOOLCHAIN="$version"
          go version
          go install golang.org/x/vuln/cmd/govulncheck@latest
          make vuln

  test-v1:
    name: Test v1 ${{ matrix.os }} Go ${{ matrix.go }}
    needs: changes
    if: needs.changes.outputs.v1_packages != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['stable', 'oldstable']
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PKGS: ${{ needs.changes.outputs.v1_packages }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Go version
        run: go version
      - name: Component graph negative fixtures
        run: go test -race -count=1 ./.github/architecture
      - name: Component graph production imports
        run: go run ./.github/architecture
      - name: Tests with race detector
        # PKGS is the package list of the classifier (validated there), word-split here.
        run: go test -race -count=1 $PKGS

  test-v2:
    name: Test v2 ${{ matrix.os }} Go ${{ matrix.go }}
    needs: changes
    if: needs.changes.outputs.v2_packages != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['stable', 'oldstable']
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PKGS: ${{ needs.changes.outputs.v2_packages }}
    defaults:
      run:
        shell: bash
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: v2/go.sum
      - name: Go version
        run: go version
      - name: Tests with race detector
        run: go test -race -count=1 $PKGS

  stress-v1:
    name: Stress v1 (race, repeated, shuffled)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.v1_packages != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PKGS: ${{ needs.changes.outputs.v1_packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Repeated race tests of the affected stress packages
        run: make test-stress PKGS="$PKGS"

  min-go-v1:
    name: Test v1 ubuntu-latest Go 1.22 (GOTOOLCHAIN=local)
    needs: changes
    if: needs.changes.outputs.v1_packages != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PKGS: ${{ needs.changes.outputs.v1_packages }}
      # Never download a newer toolchain: fail if go.mod or a dependency
      # requires a Go version newer than the installed 1.22.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
      - name: Go version
        run: |
          go version
          go version | grep -q ' go1\.22\.'
      - name: Build
        run: go build ./...
      - name: Component graph negative fixtures
        run: go test -race -count=1 ./.github/architecture
      - name: Component graph production imports
        run: go run ./.github/architecture
      - name: Tests with race detector
        run: go test -race -count=1 $PKGS

  min-go-v2:
    name: Test v2 ubuntu-latest Go 1.22 (GOTOOLCHAIN=local)
    needs: changes
    if: needs.changes.outputs.v2_packages != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PKGS: ${{ needs.changes.outputs.v2_packages }}
      # As in min-go-v1, for the v2 module.
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache-dependency-path: v2/go.sum
      - name: Go version
        run: |
          go version
          go version | grep -q ' go1\.22\.'
      - name: Build
        run: go build ./...
      - name: Tests with race detector
        run: go test -race -count=1 $PKGS

  examples-v1:
    name: Build examples v1
    needs: changes
    if: needs.changes.outputs.examples_v1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Build every example module
        run: make examples

  examples-v2:
    name: Check examples v2
    needs: changes
    if: needs.changes.outputs.examples_v2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: v2/go.sum
      # Stage 2.0 removed the runtime the v2/_examples applications build against, so only
      # the identical-copy check of chat.go runs until 2.5D migrates them.
      - name: Check the shared example sources
        run: make examples

  experiments-v2:
    name: Experiments v2
    needs: changes
    if: needs.changes.outputs.experiments_v2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: v2/go.sum
      - name: Install golangci-lint
        # The lint action runs one working directory; make experiments lints each module.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Vet, format, lint and test every experiment module
        run: make experiments
