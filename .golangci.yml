# golangci-lint v2 configuration. Run with `make lint`.
version: "2"

run:
  timeout: 3m

linters:
  # Default set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - forbidigo
  settings:
    # Examples, README snippets and library code never terminate the process: a library
    # returns the error, and a failing example main panics with it, which runs deferred
    # cleanup and can be recovered, instead of exiting past it.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^log\.(Logger\.)?Fatal(f|ln)?$
          pkg: ^log$
          msg: return the error; a failing main panics
        - pattern: ^log\.(Logger\.)?Panic(f|ln)?$
          pkg: ^log$
          msg: return the error; a failing main panics with panic(err)
        - pattern: ^os\.Exit$
          pkg: ^os$
          msg: return the error; a failing main panics
    staticcheck:
      # golangci-lint's default staticcheck selection, minus QF1008
      # (redundant embedded-field selectors), which is a style preference:
      # explicit selectors are kept where a type embeds an interface.
      checks:
        - all
        - -ST1003
        - -ST1016
        - -QF1008
  exclusions:
    rules:
      # The CI tools under .github are neither examples nor library code: they report
      # failures to the workflow through their exit status.
      - path: (^|/)\.github/(architecture|changes|coverage|stress)/
        linters: [forbidigo]
      # TestMain owns the exit status of a test binary: the goroutine-leak gates set it
      # after m.Run returns, and a helper subprocess exits before running tests.
      - path: _test\.go$
        text: os\.Exit
        linters: [forbidigo]
      # Every example module carries an identical lifecycle.go; graceful-shutdown calls
      # its serveAfter only.
      - path: _examples/graceful-shutdown/lifecycle\.go$
        text: func serve is unused
        linters: [unused]

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
