<!doctype html>
<!--
  Copied from https://github.com/socketio/socket.io (examples/chat/public/index.html)
  at commit 7a70f63499e2be66b072543db8ebf928b6923633, MIT license: see LICENSE-socket.io-chat.
  Changes: the socket.io-client script is pinned to socket.io-client@1.7.4 on
  jsDelivr with a Subresource Integrity hash; the Go server does not serve the client script.
  main.js is loaded by a relative path so that the page also works when it is mounted
  below a prefix such as /public/.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Socket.IO Chat Example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <ul class="pages">
    <li class="chat page">
      <div class="chatArea">
        <ul class="messages"></ul>
      </div>
      <input class="inputMessage" placeholder="Type here..."/>
    </li>
    <li class="login page">
      <div class="form">
        <h3 class="title">What's your nickname?</h3>
        <input class="usernameInput" type="text" maxlength="14" />
      </div>
    </li>
  </ul>

  <script src="https://code.jquery.com/jquery-1.10.2.min.js"></script>
  <!-- Engine.IO v3 supports socket.io-client 1.7.4 and 2.x. -->
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@1.7.4/dist/socket.io.js"
          integrity="sha384-vdmobhXsqKDwjUwVB+K+fVs3Ntf/3rB8/S+GWHvlcjMcb/6gy4/t8YpbrMeNNmwg"
          crossorigin="anonymous"></script>
  <script src="main.js"></script>
</body>
</html>
