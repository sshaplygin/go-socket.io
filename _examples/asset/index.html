<!doctype html>
<!--
  Copied from https://github.com/socketio/socket.io (examples/chat/public/index.html)
  at commit 7a70f63499e2be66b072543db8ebf928b6923633, MIT license: see LICENSE-socket.io-chat.
  Changes: the socket.io-client script is loaded from jsDelivr (the npm package
  socket.io-client@2.5.0, with a Subresource Integrity hash) because the Go server does not
  serve /socket.io/socket.io.js and https://cdn.socket.io/socket.io-2.5.0.js answers 404;
  main.js is loaded by a relative path so that the page also works when it is mounted
  below a prefix such as /public/.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Socket.IO Chat Example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <ul class="pages">
    <li class="chat page">
      <div class="chatArea">
        <ul class="messages"></ul>
      </div>
      <input class="inputMessage" placeholder="Type here..."/>
    </li>
    <li class="login page">
      <div class="form">
        <h3 class="title">What's your nickname?</h3>
        <input class="usernameInput" type="text" maxlength="14" />
      </div>
    </li>
  </ul>

  <script src="https://code.jquery.com/jquery-1.10.2.min.js"></script>
  <!-- This server speaks Engine.IO v3, so socket.io-client 2.x is required. -->
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@2.5.0/dist/socket.io.js"
          integrity="sha384-tqdl9kmEvVoNmc1VEJOAh6MHoXRyDLu9H57pwBSQghqNF4NbG7DEA6Pj7oVleGOn"
          crossorigin="anonymous"></script>
  <script src="main.js"></script>
</body>
</html>
